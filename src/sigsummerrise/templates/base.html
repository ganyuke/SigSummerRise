<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SigSummerRise{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1>{% block heading %}SigSummerRise{% endblock %}</h1>

  </div>
</body>
</html>
